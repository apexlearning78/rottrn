<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Future Predictor</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>Future Predictor</h1>
            <p class="subtitle">Enter your name to reveal what the future holds</p>
        </header>

        <main>
            <div class="input-section">
                <input type="text" id="nameInput" placeholder="Enter your name..." autocomplete="off">
                <button id="predictBtn">Predict Future</button>
            </div>

            <div class="result-section" id="resultSection">
                <div class="result-box">
                    <h2>Your Future</h2>
                    <p id="resultText"></p>
                </div>
            </div>
        </main>

        <footer>
            <p>Your future on rotten</p>
        </footer>
    </div>

    <script src="script.js"></script>
</body>
</html>
